name: IndexNow Resubmit All

on:
  workflow_dispatch: {}

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Submit every article URL to IndexNow
        run: |
          python - <<'EOF'
          import json, os, re, glob, urllib.request
          SITE = "https://scotttischler.com"
          keyfiles = [os.path.basename(f) for f in glob.glob("*.txt")
                      if re.fullmatch(r"[0-9a-f]{32}\.txt", os.path.basename(f))]
          if not keyfiles:
              raise SystemExit("No IndexNow key file found at repo root.")
          key = keyfiles[0][:-4]
          cat = json.load(open("_catalog.json"))["catalog"]
          urls = [f"{SITE}/articles/{c[0]}.html" for c in cat]
          urls += [f"{SITE}/sitemap.xml", f"{SITE}/", f"{SITE}/articles/"]
          payload = json.dumps({
              "host": "scotttischler.com",
              "key": key,
              "keyLocation": f"{SITE}/{key}.txt",
              "urlList": urls,
          }).encode()
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=60) as r:
              print(f"IndexNow: {r.status} {r.reason} - submitted {len(urls)} URLs")
          EOF
