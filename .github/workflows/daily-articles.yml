name: Daily AEO Articles

on:
  schedule:
    - cron: '0 14 * * *'   # 14:00 UTC daily
  workflow_dispatch: {}      # manual "Run workflow" button

permissions:
  contents: write            # commit + push with the built-in token — no PAT, no secret

concurrency:
  group: daily-articles
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install markdown playwright anthropic
          python -m playwright install --with-deps chromium

      - name: Generate today's 2 articles (queue first, else AI)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ vars.MODEL }}
        run: python scripts/generate_daily.py

      - name: Build pages + update indexes
        run: python publish_articles.py

      - name: Commit and push (auto-deploys via Netlify)
        run: |
          git config user.name "AEO Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f articles_today.py
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to publish today."
          else
            git commit -m "Daily AEO articles: $(date -u +%F)"
            git push
          fi

      - name: Submit new URLs to IndexNow (Bing / Yandex / network)
        run: python scripts/ping_indexnow.py || echo "IndexNow ping skipped"
